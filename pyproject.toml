[project]
name = "r2wa"
version = "0.1.0"
description = "Remnant 2 World & Item Analyzer for GNOME"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyGObject is deliberately not listed as a dependency: on GNOME it comes
# from the distribution (python3-gi), and a pip build needs the full GTK
# headers and would fail on the Windows development machine anyway.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
r2wa = "r2wa.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
