<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- App icon: a relic shard for the items, with a checkmark for what has
       already been collected. Deliberately its own shape - the game's own
       logo is a trademark of its rights holders and is not used here.
       Size and margins follow the GNOME icon guidelines. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2224"/>
      <stop offset="1" stop-color="#151011"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f66151"/>
      <stop offset="0.55" stop-color="#e01b24"/>
      <stop offset="1" stop-color="#a51d2d"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#ground)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none"
        stroke="#000" stroke-opacity="0.3" stroke-width="1"/>

  <!-- The shard sits up and to the left, leaving the corner for the check -->
  <g transform="translate(3,1) scale(0.78)">
    <path d="M 60 20 L 98 52 L 82 106 L 44 100 L 28 58 Z" fill="url(#shard)"/>
    <path d="M 60 20 L 28 58 L 44 100 Z" fill="#000" fill-opacity="0.2"/>
  </g>

  <!-- White rather than green: highest contrast on the dark ground, and it
       does not put the meaning on a red/green pairing. -->
  <path d="M 72 90 L 85 103 L 107 74" fill="none" stroke="#151011"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72 90 L 85 103 L 107 74" fill="none" stroke="#ffffff"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
